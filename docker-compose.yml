# Start:  docker compose up -d --build
# Web:    https://<IP-des-Boards>:8443  (HTTP 8080 leitet auf HTTPS um)
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Host-Netzwerk, damit die UDP-Broadcasts ans Lithernet-Gateway ins LAN gehen
    network_mode: host
    environment:
      HTTP_PORT: 8080
      HTTPS_PORT: 8443
    volumes:
      - ./config:/var/www/app/config   # config.php, setup.key, ssl/ bleiben erhalten
      - ./logs:/var/www/app/logs
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mariadb:11
    # Nur lokal erreichbar; im Setup-Assistenten: Host 127.0.0.1, Port 3307
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: bitte-aendern-root
      MARIADB_DATABASE: lithernet
      MARIADB_USER: lithernet
      MARIADB_PASSWORD: bitte-aendern
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db-data:
