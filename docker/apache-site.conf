# Ports kommen aus HTTP_PORT / HTTPS_PORT (siehe docker-compose.yml)
Listen ${HTTPS_PORT}
ServerName localhost

# Wichtig: die Fallback-.htaccess im Projekt-Root (leitet alles nach public/ um)
# darf hier nicht greifen, da der Document Root schon public/ ist.
<Directory /var/www/app>
    AllowOverride None
    Require all denied
</Directory>

<VirtualHost *:${HTTP_PORT}>
    DocumentRoot /var/www/app/public
    <Directory /var/www/app/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>
    # Kamera braucht HTTPS -> alles umleiten
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}:${HTTPS_PORT}%{REQUEST_URI} [R=302,L]
</VirtualHost>

<VirtualHost *:${HTTPS_PORT}>
    DocumentRoot /var/www/app/public
    SSLEngine on
    SSLCertificateFile    /var/www/app/config/ssl/cert.pem
    SSLCertificateKeyFile /var/www/app/config/ssl/key.pem
    <Directory /var/www/app/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
